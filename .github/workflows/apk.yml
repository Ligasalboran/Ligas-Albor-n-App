name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Buscar la carpeta de la app
        run: |
          f=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ]; then echo "No encuentro capacitor.config.json. Archivos del repositorio:"; ls -R | head -60; exit 1; fi
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Carpeta de la app: $(dirname "$f")"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        working-directory: ${{ env.APP_DIR }}
        run: npm install
      - name: Crear proyecto Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android && npx cap sync android
      - name: Compilar APK
        working-directory: ${{ env.APP_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ligas-alboran-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
