async function lp(){const{data,error}=await sb.rpc('personas');if(fail(error))return;$('pe').innerHTML=data.map(p=>`<div class="jr"><span>${p.admin?'🛡️':'👤'}</span><div style="flex:1"><b>${esc(p.nombre)}</b><br><small>${esc(p.email)}</small></div><button class="${p.admin?'g2':'b'}" onclick="sa('${p.id}',${!p.admin})">${p.admin?'Quitar organizador':'Hacer organizador'}</button></div>`).join('')||'Nadie registrado'}
async function sa(id,v){const{error}=await sb.rpc('set_admin',{p_id:id,p_valor:v});if(fail(error))return;toast(v?'Ahora es organizador':'Ya no es organizador');if(id==S.me.id&&!v){await boot();location.hash='inicio'}else lp()}
async function gn(){const n=$('nn').value.trim();if(!n)return toast('Escribe un nombre');const{error}=await sb.rpc('cambiar_nombre',{p_nombre:n});if(!fail(error)){toast('Nombre guardado');boot()}}

t=S.M.filter(m=>!o||f===''||sd(m).some(p=>p[0]==+f)).map(m=>{const[h,a]=sd(m);return'BEGIN:VEVENT\nUID:alb'+m.id+'@ligas-alboran\nDTSTAMP:20260101T000000Z\nDTSTART:'+z(m)+'\nDTEND:'+z(m,1)+'\nSUMMARY:'+nn(h)+' vs '+nn(a)+'\nLOCATION:'+m.v+'\nEND:VEVENT'}).join('\n'),
l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Ligas Alboran//ES\n'+t+'\nEND:VCALENDAR'],{type:'text/calendar'}));l.download='ligas-alboran.ics';l.click()}
